services:
  - type: web
    name: focusframe
    runtime: node
    buildCommand: cd server && npm install
    startCommand: node server/server.js
    envVars:
      - key: GMAIL_USER
        value: hellofocusframe26@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SENDER_NAME
        value: FocusFrame
      - key: CRON_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
